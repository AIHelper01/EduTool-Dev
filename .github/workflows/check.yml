name: Repository check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_repo.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/check_homepage_language.js
